name: Build Shinden (release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > shinden-release.jks

      - name: Spotless apply
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessApply

      - name: Build shinden release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :src:pl:shinden:assembleRelease \
            -Pandroid.injected.signing.store.file=shinden-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: shinden-release-apk
          path: src/pl/shinden/build/outputs/apk/release/*.apk
